<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Test Modul 04 - JavaScript</title>
</head>
<body>
  <h2>Hasil Pre-Test JavaScript</h2>

  <script>
    // ==========================================
    // PRE-TEST NO. 2: Deklarasi Variabel (var, let, const)
    // ==========================================
    console.log("=== PRE-TEST NO. 2: VARIABEL ===");

    var nama = "Budi";       // Function scope, bisa diubah & dideklarasikan ulang
    let umur = 20;           // Block scope, bisa diubah nilainya
    const kampus = "UNIKU";  // Block scope, nilai tetap (konstanta)

    console.log("Nama:", nama);
    console.log("Umur:", umur);
    console.log("Kampus:", kampus);

    // Mengubah nilai var dan let
    nama = "Andi";
    umur = 21;
    console.log("Setelah diubah -> Nama:", nama, "| Umur:", umur);

    // ==========================================
    // PRE-TEST NO. 3: Kondisi (if, else if, else)
    // ==========================================
    console.log("\n=== PRE-TEST NO. 3: KONDISI IF / ELSE IF / ELSE ===");

    let nilai = 82;

    if (nilai >= 85) {
      console.log("Nilai:", nilai, "-> Predikat: A");
    } else if (nilai >= 70) {
      console.log("Nilai:", nilai, "-> Predikat: B");
    } else if (nilai >= 55) {
      console.log("Nilai:", nilai, "-> Predikat: C");
    } else {
      console.log("Nilai:", nilai, "-> Predikat: D");
    }
  </script>
</body>
</html>
